<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RepoPulse</title>
  <meta name="description" content="Download statistics for GitHub releases">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css?v=1.1.0">
  <script src="/static/js/theme.js?v=1.1.0"></script>
  <script src="/static/vendor/chart.umd.min.js" defer></script>
  <script type="module" src="/static/js/app.js?v=1.1.0"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Dashboard home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M2 18h7l3-9 5 16 4-11 2 4h7" fill="none" stroke="currentColor" stroke-width="2.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">
        <span class="brand-title" id="site-title">RepoPulse</span>
        <span class="brand-sub" id="site-subtitle"></span>
      </span>
    </a>
    <nav class="topnav" aria-label="Main">
      <a href="/" data-link="dashboard">Dashboard</a>
      <a href="/admin" data-link="admin">Admin</a>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="sun" d="M12 4V2m0 20v-2m8-8h2M2 12h2m13.66-5.66 1.41-1.41M4.93 19.07l1.41-1.41m0-11.32L4.93 4.93m14.14 14.14-1.41-1.41M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/><path class="moon" d="M21 13.2A8.5 8.5 0 1 1 10.8 3a6.6 6.6 0 0 0 10.2 10.2Z"/></svg>
      </button>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <div class="boot" aria-live="polite">Loading statistics…</div>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
